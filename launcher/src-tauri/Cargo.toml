[package]
name = "helix-launcher"
version = "0.1.0"
description = "Helix Client Launcher"
authors = ["Helix Client"]
edition = "2021"

[lib]
name = "helix_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = [] }
ureq = { version = "2", features = ["json"] }
urlencoding = "2"
